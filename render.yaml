services:
  - type: web
    name: fidel-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-4-hydrogen
      - key: ENABLE_GOOGLE_SEARCH
        value: "true"
